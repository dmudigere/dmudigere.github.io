name: Refresh Scholar citations
on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays 14:17 UTC
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch citations
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_citations.py
      - name: Commit if changed
        run: |
          if git diff --quiet citations.js; then echo "No change"; exit 0; fi
          git config user.name "citations-bot"
          git config user.email "citations-bot@users.noreply.github.com"
          git add citations.js
          git commit -m "Refresh Scholar citations"
          git push
 
